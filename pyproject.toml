[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heliosynth"
version = "0.1.0"
description = "Helioseismic data processing and sonification pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sunpy",
    "drms",
    "astropy",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "zarr~=3.0",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
heliosynth = "heliosynth.__main__:main"